<title>Wavemotion</title><meta name="robots" content="noindex">
<script>
  // App addresses (Living Destinations, connect links, sign-in, receipts) live in the
  // Wavemotion app. Carry the visitor there with the same path, query and anchor.
  var APP = "https://wavemotion.dhill5711.workers.dev";
  var p = location.pathname;
  // Creator short links belong to WOW's attribution owner, not the studio.
  if (/^\/@[a-zA-Z0-9_.-]{2,32}\/?$/.test(p)) {
    location.replace("https://thewow.online/w/" + p.slice(1).replace(/\/$/, "") + location.search + location.hash);
  }
  if (/^\/(d|connect|go|auth|api)(\/|$)/.test(p)) location.replace(APP + p + location.search + location.hash);
</script>
